    <style>
      :root{color-scheme:dark;--ln:#3fc8ff;--tx:#e8f4ff;--mu:#7f9bbd;--wr:#ff6b6b;--ok:#4be3a1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
      *{box-sizing:border-box}html,body{margin:0;background:#050b18;color:var(--tx);font-family:-apple-system,system-ui,sans-serif}
      body{max-width:520px;margin:0 auto;padding:14px 14px 130px;background:radial-gradient(circle at 50% -10%,#12305e,#050b18 60%)}
      #app{position:relative;z-index:1}

      h1{font-size:13px;letter-spacing:3px;color:var(--ln);margin:0 0 8px;text-transform:uppercase}
      .lvl{font-size:40px;font-weight:900;font-style:italic;text-shadow:0 0 14px var(--ln)}

      .bar i{display:block;height:100%;transition:width .8s;background:linear-gradient(90deg,#2a7fff,#3fe0ff,#2a7fff);background-size:200% 100%;animation:sh 2s linear infinite}
      .top{display:flex;align-items:center;gap:10px}.top>div:last-child{flex:1}
      .ex{padding:10px 0;border-top:1px solid #1f4a7a55}.ex:first-of-type{border-top:0}.ex.ok b{color:var(--ok)}
      .sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
      .sb{width:42px;height:42px;border-radius:50%;padding:0}.sb.d{background:var(--ok);color:#012;border-color:var(--ok);font-weight:800;animation:pop .35s}
      button,input,select{font:inherit;color:var(--tx);background:#12315f;border:1px solid var(--ln);border-radius:9px;padding:8px 11px}
      input,select{background:#0a1226;width:100%;min-width:0}button:active{background:#1d5aa8;transform:scale(.97)}button:disabled{opacity:.4}
      .big{width:100%;padding:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-top:12px;background:linear-gradient(90deg,#1d5aa8,#2a9bff)}
      .big:not(:disabled){animation:gl 1.8s infinite}
      .chip{display:inline-block;margin:3px 3px 3px 0;border-radius:20px;padding:8px 13px;font-size:14px;background:#0a1226}.chip.on{background:#1d5aa8;box-shadow:0 0 10px var(--ln);font-weight:700}
      .warn{color:var(--wr);font-size:13px;margin-top:10px}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ln)}
      nav{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:4;background:#081224d9;backdrop-filter:blur(14px);border-top:1px solid #1f4a7a;padding-bottom:env(safe-area-inset-bottom,0px)}
      nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 0 12px;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1}.ni{font-size:26px}nav button.on{color:var(--ln);font-weight:800;box-shadow:inset 0 3px 0 var(--ln);background:#12315f55}
      .st{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #1f4a7a55;gap:10px}.st:first-of-type{border-top:0}
      .note{background:#0a1730;border-left:3px solid var(--ln);padding:10px;border-radius:6px;font-size:13px;margin-bottom:10px}
      .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.g label{font-size:11px;color:var(--mu)}
      #rest{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;display:none;text-align:center;z-index:5;background:#0b1d3a;border:1.5px solid var(--ln);border-radius:14px;padding:12px;box-shadow:0 0 24px #3fc8ff66}
      #rest .timer{font-size:38px;display:block}
      #lu{position:fixed;inset:0;display:none;z-index:9;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(#12305ecc,#050b18ee)}
      #lu.show{display:flex;animation:fi .3s}.lt{font-size:44px;font-weight:900;font-style:italic;text-align:center;text-shadow:0 0 30px var(--ln);animation:zi .6s cubic-bezier(.2,1.6,.4,1)}
      #lu i{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--ln);box-shadow:0 0 8px var(--ln);animation:bs 1.4s var(--d) ease-out forwards}
      .pt{position:fixed;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--ln);opacity:0;pointer-events:none;animation:rise var(--t) linear infinite}
      svg .fl{animation:fl 3.5s ease-in-out infinite}svg .pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      svg .rot{animation:rot 30s linear infinite;transform-box:fill-box;transform-origin:center}svg .sc{animation:sc 3s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
      @keyframes fl{50%{transform:translateY(-6px)}}@keyframes pu{50%{opacity:.55;transform:scale(1.06)}}@keyframes rot{to{transform:rotate(360deg)}}
      @keyframes sc{50%{transform:skewX(6deg)}}@keyframes fi{from{opacity:0;transform:translateY(10px)}}@keyframes pop{40%{transform:scale(1.3)}}
      @keyframes sh{to{background-position:200% 0}}@keyframes gl{50%{box-shadow:0 0 22px #3fc8ff}}@keyframes zi{from{transform:scale(.2);opacity:0}}
      @keyframes bs{to{transform:translate(var(--x),var(--y));opacity:0}}@keyframes rise{10%{opacity:.7}to{transform:translateY(-105vh);opacity:0}}
      #ts{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:496px;margin:0 auto;z-index:10;pointer-events:none}
      .tt{background:#0b1d3af2;border:1.5px solid var(--ln);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;box-shadow:0 0 18px #3fc8ff88;animation:tin .35s,tout .4s 2.8s forwards}.tt b{color:var(--ln);letter-spacing:2px}
      .fx{position:fixed;z-index:8;font-weight:900;color:#7df;text-shadow:0 0 10px var(--ln);pointer-events:none;transform:translateX(-50%);animation:fxu 1s ease-out forwards}
      .bd{text-align:center;padding:8px 2px;border-radius:10px;background:#0a1226;filter:grayscale(1);opacity:.45}.bd.on{filter:none;opacity:1;box-shadow:0 0 12px var(--ln);animation:pu 3s infinite}
      .top{position:relative;overflow:hidden}.top::after{content:'';position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(transparent,#3fc8ff22,transparent);animation:sl 4s linear infinite;pointer-events:none}
      #lu.show{animation:fi .3s,fx2 .6s}
      @keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}@keyframes fxu{to{transform:translate(-50%,-60px);opacity:0}}@keyframes sl{to{top:110%}}@keyframes fx2{from{filter:brightness(4)}}
      .win:not(.top)::before,.win:not(.top)::after{content:'';position:absolute;width:16px;height:16px;border:3px solid var(--ln);pointer-events:none;filter:drop-shadow(0 0 4px var(--ln))}
      .win:not(.top)::before{top:-3px;left:-3px;border-right:0;border-bottom:0;border-top-left-radius:14px}.win:not(.top)::after{bottom:-3px;right:-3px;border-left:0;border-top:0;border-bottom-right-radius:14px}
      h1{font-style:italic;font-weight:900}.qi .lvl{letter-spacing:1px}
      .hx{aspect-ratio:1;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);display:flex;align-items:center;justify-content:center;font-weight:900;font-style:italic;font-size:22px;background:#0a1226;color:var(--c);opacity:.4}
      .hx.on{opacity:1;background:linear-gradient(135deg,var(--c),#0a1226 90%);color:#fff}.g8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
      .pc{flex:0 0 160px;min-height:130px;border:1.5px solid var(--ln);border-radius:12px;padding:12px;background:linear-gradient(160deg,#12305e,#0a1226)}.pc b{font-style:italic}
      .bolt{position:fixed;top:0;left:0;height:100%;width:34%;z-index:0;pointer-events:none;fill:none;stroke:#aee4ff;stroke-width:1.4;filter:drop-shadow(0 0 6px #3fc8ff);opacity:0;animation:fz 9s infinite}.bolt.b2{left:auto;right:0;transform:scaleX(-1);animation-delay:4.5s}
      @keyframes fz{0%,90%,100%{opacity:0}92%{opacity:.9}94%{opacity:.1}96%{opacity:.8}}
      .pc{padding:0;overflow:hidden}.pc svg{display:block;width:100%;height:120px;background:linear-gradient(#d9dce2,#7d8594)}.pc .tx{padding:10px;margin-top:-30px;position:relative;background:linear-gradient(transparent,#0a1226 38%)}
      .cf{position:absolute;top:-14px;width:8px;height:14px;animation:cfa 3s linear infinite;pointer-events:none}@keyframes cfa{to{transform:translateY(105vh) rotate(720deg)}}
      #lu{overflow-y:auto;padding:16px}svg .em{animation:emb 3.2s linear infinite}@keyframes emb{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-150px);opacity:0}}
      #rg{width:130px;height:130px;margin:0 auto 8px;border-radius:50%;background:conic-gradient(var(--ln) calc(var(--p)*1%),#12315f 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
      #rg::before{content:'';position:absolute;inset:8px;border-radius:50%;background:#0b1d3a}#rg>*{position:relative}#rg .timer{font-size:28px}
      .fp{width:110px;height:110px;margin:20px auto;border-radius:50%;border:3px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:44px;touch-action:none;user-select:none;-webkit-user-select:none}.fp.hold{animation:hf 1.5s linear forwards}
      @keyframes hf{from{box-shadow:0 0 0 0 #3fc8ff}to{box-shadow:0 0 40px 10px #3fc8ff;transform:scale(1.15)}}
      input[type=range]{padding:0;border:0;background:none;accent-color:#3fc8ff}.opt{display:flex;justify-content:space-between;align-items:center;padding:14px;margin:10px 0}
      #rg.sm{width:70px;height:70px}#rg.sm .timer{font-size:18px}#rg.sm .mu{display:none}
    </style>
  </head>

    <script>
      const KEY='ascend_v3',$=id=>document.getElementById(id);
      const Z={pet:'Petto',sch:'Schiena',spa:'Spalle',bra:'Braccia',gam:'Gambe',glu:'Glutei',cor:'Addome',car:'Cardio'};
      const ST={pet:'str',sch:'str',spa:'str',bra:'str',gam:'agi',glu:'agi',cor:'vit',car:'end'};
      const LIB='Flessioni|pet|r|h;Flessioni inclinate|pet|r|h;Flessioni diamante|pet|r|h;Panca piana|pet|r|g;Croci manubri|pet|r|g;Chest press|pet|r|g;Superman|sch|r|h;Rematore manubrio|sch|r|g;Trazioni|sch|r|g;Lat machine|sch|r|g;Pike push-up|spa|r|h;Plank to push|spa|r|h;Alzate laterali|spa|r|g;Military press|spa|r|g;Dip su sedia|bra|r|h;Flessioni stretti|bra|r|h;Curl bicipiti|bra|r|g;French press|bra|r|g;Squat|gam|r|h;Affondi|gam|r|h;Squat bulgaro|gam|r|h;Calf raise|gam|r|h;Leg press|gam|r|g;Stacco rumeno|gam|r|g;Glute bridge|glu|r|h;Donkey kick|glu|r|h;Squat sumo|glu|r|h;Hip thrust|glu|r|g;Crunch|cor|r|h;Plank|cor|t|h;Russian twist|cor|r|h;Sollevamento gambe|cor|r|h;Mountain climber|cor|t|h;Side plank|cor|t|h;Jumping jack|car|t|h;Burpees|car|r|h;Corsa sul posto|car|t|h;Corda|car|t|h;Ginocchia alte|car|t|h;Skater|car|t|h'.split(';').map(s=>{const a=s.split('|');return{n:a[0],z:a[1],t:a[2],q:a[3]}});
      const RANK=['E','D','C','B','A','S','SS','SSS'],RC=['#7f9bbd','#4be3a1','#3fc8ff','#ffcf4a','#4be3a1','#6a6cff','#c04bff','#ff2d4d'],TT=['Novizio','Risvegliato','Cacciatore','Veterano','Élite','Monarca','Leggenda','Sovrano'];
      const GL={tone:'Tonificare',str:'Forza',car:'Cardio',full:'Total body'},DN=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
      const today=()=>new Date().toLocaleDateString('sv');
      const mk=(e,sets,reps,w,rest)=>({id:Math.random().toString(36).slice(2,8),n:e.n,mg:e.z,t:e.t,sets,reps,w,rest});
      let S,tab='q',note='',w={g:'tone',z:'glu',x:2,q:'h',d:[1,3,5],m:30,wk:12};
      try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
      S=S||{xp:0,lvl:1,day:1,streak:0,stats:{str:5,agi:5,vit:5,end:5},log:[],q:null,rem:'19:00',lastN:'',setup:false,days:[1,3,5],plan:[],goal:''};
      if(S.setup)S.aw=1;if(!S.setup)tab='w';
      let boot=1,pT;const save=()=>{if(!boot)S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!boot){clearTimeout(pT);pT=setTimeout(push,2500)}};
      const reps=e=>e.reps+(e.w||e.t==='t'||S.tl?0:Math.floor((S.lvl-1)/2));
      const need=()=>100*S.lvl,rk=()=>Math.min(7,Math.floor((S.lvl-1)/5));
      const est=e=>e.sets*((e.t==='t'?e.reps:e.reps*3+10)+e.rest)/60;
      function gen(g,z,x,q,m,ph){
      const P=zz=>LIB.filter(e=>(zz?e.z===zz:1)&&(q==='g'||e.q==='h')),by=n=>LIB.find(e=>e.n===n),T=e=>e.t==='t'?30+x*10:12;let L=[];
      if(ph&&PHT[ph]){const T=PHT[ph],nm=(q==='g'&&T.G)||T.L;L=nm.map(n=>by(n)).filter(Boolean).map(e=>mk(e,T.s+(x>2?1:0),e.t==='t'?30+x*12:T.r[x-1],0,T.rest))}
      else if(g==='tone')L=P(z).slice(0,6).concat(z!=='cor'?P('cor').slice(0,2):[]).map(e=>mk(e,1+x,T(e),0,45));
      else if(g==='str'){const A=q==='g'?['Squat','Panca piana','Stacco rumeno','Rematore manubrio','Military press','Trazioni','Hip thrust']:['Squat bulgaro','Flessioni diamante','Glute bridge','Superman','Pike push-up','Affondi','Dip su sedia'];L=A.map(n=>mk(by(n),2+x,q==='g'?5:8,0,120))}
      else if(g==='car')L=P('car').map(e=>mk(e,2+x,T(e),0,20));
      else{const Zs=['gam','pet','sch','spa','cor','car'];L=Zs.map(zz=>P(zz)[0]).concat(Zs.map(zz=>P(zz)[1])).filter(Boolean).map(e=>mk(e,1+x,T(e),0,60))}
      const av=Math.max(8,m-10),sum=()=>L.reduce((a,e)=>a+est(e),0);
      while(sum()>av&&L.length>3)L.pop();
      if(sum()>av)L.forEach(e=>e.sets=Math.max(2,e.sets-1));
      return L}
      function newDay(){const t=today();if(S.q&&S.q.date===t){link();return}
      if(S.q){if(!S.q.done&&!S.q.rest&&S.plan.length){S.xp=Math.max(0,S.xp-50);S.streak=0;S.log.push({d:S.q.date,v:0,xp:-50});note='⚠ Penalità: missione di ieri non completata, −50 XP e serie azzerata.'}S.day++}
      S.q={date:t,p:{},wu:[],cd:[],done:false,rest:!S.days.includes(new Date().getDay())};setSi();link();save();if(S.setup&&!S.q.rest)toast('📜 Nuova missione giornaliera ricevuta')}
      function setTap(id,i){if(!S.q.st){toast('Premi “Inizia missione” per cominciare');return}const p=S.q.p[id]||0,e=S.plan.find(x=>x.id===id),ev=window.event;S.q.p[id]=(i<p)?i:i+1;const m=S.q.mx=S.q.mx||{};if(S.q.p[id]>(m[id]||0)){m[id]=S.q.p[id];fx(ev,'+5 XP');addXp(5)}save();render();if(S.q.p[id]>p&&e.rest)rStart(e.rest)}
      function addXp(g,q){const r0=rk(),l0=S.lvl;S.xp+=g;let up=0;while(S.xp>=need()){S.xp-=need();S.lvl++;up++;S.pts=(S.pts||0)+3}
      if(q);else if(rk()>r0)burst('NUOVO RANGO<br>'+RANK[rk()],TT[rk()]);else if(up)burst('LEVEL UP!','Livello '+S.lvl+' · +'+3*up+' punti statistica');unlk(l0,r0);return up}
      function complete(){if(S.q.done)return;S.q.done=true;S.streak++;PRS=[];let v=0,ns=0;
      S.plan.forEach(e=>{const t=S.q.p[e.id]||0;S.sets=(S.sets||0)+t;ns+=t;if(t){const L=(S.ex=S.ex||{})[e.n]=S.ex[e.n]||[],nv=(e.w||20)*(e.t==='t'?e.reps:reps(e));if(L.length&&nv>Math.max(...L.map(l=>(l.w||20)*l.r)))PRS.push({n:e.n,v:e.w?e.w+' kg × '+reps(e):(e.t==='t'?e.reps+' s':reps(e)+' rip.')});S.mz=S.mz||{};S.mz[e.mg]=(S.mz[e.mg]||0)+t*10;L.push({d:S.q.date,w:e.w||0,r:e.t==='t'?e.reps:reps(e)})}v+=t*(e.t==='t'?e.reps/10:reps(e)*(e.w||1));S.stats[ST[e.mg]||'vit']+=1});
      let g=100+Math.min(S.streak,10)*10+20*['wu','cd'].filter(k=>(S.q[k]||[]).filter(Boolean).length>=2).length,b=0;
      S.log.push({d:S.q.date,v:Math.round(v),xp:g,s:ns});
      if(weekDone()>=S.days.length&&S.wkc!==wkKey()){S.wkc=wkKey();b=150;g+=150;S.log[S.log.length-1].xp=g}
      const l0=S.lvl,x0=S.xp;save();addXp(g,1);checkAch();sumScr({v:Math.round(v),ns,g,b,l0,x0,l1:S.lvl,mins:S.q.st?Math.max(1,Math.round((Date.now()-S.q.st)/60000)):0});render()}
      function burst(t,s){const o=$('lu');o.innerHTML=(/LEVEL|RANGO/.test(t)?`<div class="win" style="text-align:center;margin:0 0 10px;padding:8px 24px">${hero(120,'hb')}<div class="lvl" style="font-size:32px">LVL ${S.lvl}</div><div class="mu">Giorno ${S.day}</div></div><div class="mu" style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;font-size:11px">Livello su!<br>Livello su!<br>Livello su!</div>`:'')+`<div class="lt">${t}</div><div class="mu" style="font-size:18px;margin-top:8px">${s}</div>`+Array.from({length:28},()=>`<i style="--x:${(Math.random()*2-1)*170}px;--y:${(Math.random()*2-1)*280}px;--d:${Math.random()*.4}s"></i>`).join('');o.className='show';setTimeout(()=>o.className='',2800);o.onclick=()=>o.className=''}
      let rEnd=0,rI,rTot=1;
      function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>o.stop(),400)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

      function gPlay(m){$('rq').style.display='none';$('gm').style.display='block';$('rg').classList.add('sm');if(m==='new'||!G||G.over)G=newG();$('gs').innerHTML='';gCd(3)}
      function gCd(n){clearTimeout(gCdT);gDraw(n);if(n>0)gCdT=setTimeout(()=>gCd(n-1),700);else gRun()}
      function gRun(){gLast=performance.now();cancelAnimationFrame(gRaf);const f=t=>{const dt=Math.min(.033,(t-gLast)/1000);gLast=t;gStep(dt);gDraw();if(!G.over)gRaf=requestAnimationFrame(f);else{gRaf=0;gEnd()}};gRaf=requestAnimationFrame(f)}
      function gPause(){clearTimeout(gCdT);cancelAnimationFrame(gRaf);gRaf=0}
      const gGoal=()=>Math.min(600,100+50*Math.floor((S.hs||0)/150));
      function gEnd(){const t=today(),nr=G.sc>(S.hs||0);S.hs=Math.max(S.hs||0,G.sc);S.gp=(S.gp||0)+1;if(!S.gx||S.gx.d!==t)S.gx={d:t,xp:0};
      const b=Math.min(Math.floor(G.sc/20)+(nr&&G.sc>=50?25:0),Math.max(0,100-S.gx.xp));S.gx.xp+=b;let m='';
      if(G.sc>=gGoal()&&S.gg!==t){S.gg=t;m=' · obiettivo giornaliero +40 XP';addXp(40)}
      if(b>0)addXp(b);save();checkAch();gDraw();if(nr&&G.sc>=50)toast('🏁 Nuovo record: '+G.sc+' punti');
      $('gs').innerHTML='Game over · '+G.sc+' pt · Record '+S.hs+(b>0?' · +'+b+' XP':(S.gx.xp>=100?' · limite XP giornaliero raggiunto':''))+m+' <button onclick="gPlay(\'new\')">Riprova</button>'}
      function gJump(){if(G&&G.y===0)G.vy=-640}
      function gDuck(){if(!G)return;if(G.y<0)G.vy=Math.max(G.vy,760);else G.duck=.6}
      function gStep(dt){const g=G;g.spd=Math.min(520,g.spd+dt*6);g.d+=g.spd*dt;g.sc=Math.floor(g.d/10);g.f+=dt*10;if(g.duck>0)g.duck-=dt;
      g.vy+=1800*dt;g.y+=g.vy*dt;if(g.y>0){g.y=0;g.vy=0}
      g.nx-=g.spd*dt;if(g.nx<=0){g.obs.push(Math.random()<.35&&g.sc>40?{x:GW+10,w:34,h:18,t:'a',yy:GY-52}:{x:GW+10,w:20+(Math.random()*16|0),h:26+(Math.random()*18|0),t:'g',yy:0});g.nx=300+Math.random()*260+g.spd*.35}
      g.obs.forEach(o=>o.x-=g.spd*dt);g.obs=g.obs.filter(o=>o.x+o.w>-10);
      const h=g.duck>0&&g.y===0?24:44,top=GY+g.y-h,bot=GY+g.y;
      g.obs.forEach(o=>{const ot=o.t==='g'?GY-o.h:o.yy,ob=o.t==='g'?GY:o.yy+18;if(64<o.x+o.w&&82>o.x&&top+3<ob&&bot-3>ot)g.over=1})}
      function gDraw(cd){const c=$('gc').getContext('2d'),g=G||newG(),col=/^#/.test(S.cz.cl)?S.cz.cl:RC[rk()],gr=c.createLinearGradient(0,0,0,GH);
      gr.addColorStop(0,'#0c2a5a');gr.addColorStop(1,'#050b18');c.fillStyle=gr;c.fillRect(0,0,GW,GH);
      c.strokeStyle='#3fc8ff';c.lineWidth=2;c.beginPath();c.moveTo(0,GY);c.lineTo(GW,GY);c.stroke();c.fillStyle='#3fc8ff66';for(let i=0;i<12;i++){const x=((i*60-g.d*.6)%GW+GW)%GW;c.fillRect(x,GY+8+i%3*8,18,2)}
      const h=g.duck>0&&g.y===0?24:44,hy=GY+g.y-h,ph=Math.floor(g.f)%2;c.fillStyle='#12244a';c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=8;
      c.fillRect(60,hy+14,26,h-22);c.strokeRect(60,hy+14,26,h-22);c.beginPath();c.arc(73,hy+8,9,0,7);c.fill();c.stroke();c.shadowBlur=0;
      c.fillStyle=col;c.fillRect(75,hy+6,6,3);c.beginPath();c.moveTo(62,hy+16);c.lineTo(46,hy+18+Math.sin(g.f)*4);c.lineTo(34,hy+14+Math.sin(g.f+1)*5);c.stroke();
      c.fillRect(64,GY+g.y-8,7,8-(g.y<0?0:ph*3));c.fillRect(77,GY+g.y-8,7,8-(g.y<0?0:(1-ph)*3));
      g.obs.forEach(o=>{if(o.t==='g'){c.fillStyle='#ff4d6d';const n=Math.max(1,Math.round(o.w/14));for(let k=0;k<n;k++){c.beginPath();c.moveTo(o.x+k*o.w/n,GY);c.lineTo(o.x+(k+.5)*o.w/n,GY-o.h);c.lineTo(o.x+(k+1)*o.w/n,GY);c.fill()}}
        else{c.fillStyle='#a78bfa';const fl=ph?-8:8;c.beginPath();c.ellipse(o.x+17,o.yy+9,12,8,0,0,7);c.fill();c.beginPath();c.moveTo(o.x+6,o.yy+9);c.lineTo(o.x-4,o.yy+9+fl);c.lineTo(o.x+14,o.yy+7);c.moveTo(o.x+28,o.yy+9);c.lineTo(o.x+38,o.yy+9+fl);c.lineTo(o.x+20,o.yy+7);c.fill()}});
      c.fillStyle='#e8f4ff';c.font='bold 16px sans-serif';c.textAlign='right';c.fillText('HI '+(S.hs||0)+'   '+g.sc,GW-12,22);
      c.textAlign='center';if(cd>0){c.font='900 70px sans-serif';c.fillText(cd,GW/2,GH/2+24)}else if(g.over){c.font='900 36px sans-serif';c.fillText('GAME OVER',GW/2,GH/2)}
      else if(!gRaf){c.font='bold 18px sans-serif';c.fillText('⏸ In pausa',GW/2,GH/2)}}
      const gcv=$('gc');gcv.addEventListener('pointerdown',e=>{gx0=e.clientX;gy0=e.clientY;e.preventDefault()});
      gcv.addEventListener('pointerup',e=>{if(!G||G.over||!gRaf)return;const dy=e.clientY-gy0;if(dy>20)gDuck();else gJump()});
      addEventListener('keydown',e=>{if(!gRaf||!G)return;if(e.key==='ArrowUp'||e.key===' ')gJump();if(e.key==='ArrowDown')gDuck()});
      function setSx(v){S.pf.sx=v;if(S.cz.fm==='hood')S.cz.fm='anime';if(!S.cz.hu)S.cz.hr=v==='f'?'long':'swept';save();render()}
      function left(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1000),f=x=>String(x).padStart(2,'0');return f(Math.floor(s/3600))+':'+f(Math.floor(s%3600/60))+':'+f(s%60)}
      function render(){const a=$('app');
      if(!S.aw){a.innerHTML=awake();return}
      if(tab==='w'){a.innerHTML=wiz();return}
      const head=`<div class="win top"><div>${hero(78,'h1')}</div><div><h1>${TT[rk()]}</h1><div class="lvl">LVL ${S.lvl}</div><div class="mu">Giorno ${S.day} · Rango ${RANK[rk()]} · 🔥 ${S.streak}</div><div class="bar"><i style="width:${S.xp/need()*100}%"></i></div><div class="mu" style="margin-top:4px">${S.xp} / ${need()} XP</div></div></div>`;
      const nt=note?`<div class="note">${note}</div>`:'';
      if(tab==='q'){const all=S.plan.length&&S.plan.every(e=>(S.q.p[e.id]||0)>=e.sets);
        a.innerHTML=head+nt+goals()+(S.q.rest?`<div class="win"><h1>😴 Giorno di riposo</h1><div class="mu">Oggi non c’è missione e non ci sono penalità. Il recupero fa crescere i muscoli: idratati, dormi bene e fai un po’ di stretching.</div></div>`:
        phase('wu',phases().wu)+`<div class="win qi"><h1>ⓘ Quest Info</h1><div class="lvl" style="font-size:22px">Allenamento giornaliero${S.split&&S.split.length>1?' · '+S.split[S.si].n:''}</div><div class="mu">${S.goal}${S.m?' · '+S.m+' min':''} · Giorno ${S.day}</div><div class="mu" style="margin-top:8px;letter-spacing:2px">OBIETTIVO:</div>`+S.plan.map(e=>{const p=S.q.p[e.id]||0;
        return `<div class="ex ${p>=e.sets?'ok':''}"><b>${e.n}</b> <span class="mu">${e.sets}×${e.t==='t'?e.reps+'s':reps(e)}${e.w?' · '+e.w+'kg':''} · riposo ${e.rest}s · ${Z[e.mg]}</span><div class="sets">`+Array.from({length:e.sets},(_,i)=>`<button class="sb ${i<p?'d':''}" onclick="setTap('${e.id}',${i})">${i<p?'✓':i+1}</button>`).join('')+`<button class="sb" style="width:auto;border-radius:20px;padding:0 12px" onclick="rStart(${e.rest||60})">⏱ Rest</button></div></div>`}).join('')+
        `${S.q.st||S.q.done?`<button class="big" ${all&&!S.q.done?'':'disabled'} onclick="complete()">${S.q.done?'Completata ✓':'Completa missione'}</button>`:`<button class="big" onclick="startQ()">▶ Inizia missione</button>`}${S.q.st&&!S.q.done?'<button onclick="rStart(60)" style="width:100%;margin-top:8px">⏱ REST · pausa e minigioco</button>':''}<div class="warn">⚠ AVVISO — Non completare la missione entro il tempo concesso comporta una penalità.</div><div class="timer" id="tm" style="font-size:30px;text-align:center;margin-top:8px">${tmTxt()}</div></div>`+phase('cd',phases().cd))}
      else if(tab==='p'){a.innerHTML=tlWin()+progLib()+`<div class="win"><h1>Programma</h1><div>${S.goal||'—'}</div><div class="mu">Sessioni: ${S.split&&S.split.length>1?S.split.map((x,i)=>(i===S.si?'▶ ':'')+x.n).join(' · '):'unica'}</div><div class="mu">${[1,2,3,4,5,6,0].filter(d=>S.days.includes(d)).map(d=>DN[d]).join(' · ')}</div><button class="big" onclick="tab='w';render()">🎯 Cambia programma</button></div><div class="win"><h1>Esercizi</h1>`+S.plan.map(e=>`<div class="ex"><input value="${e.n}" onchange="upd('${e.id}','n',this.value)"><div class="g"><div><label>Serie</label><input type="number" inputmode="numeric" value="${e.sets}" onchange="upd('${e.id}','sets',this.value)"></div><div><label>${e.t==='t'?'Secondi':'Ripet.'}</label><input type="number" inputmode="numeric" value="${e.reps}" onchange="upd('${e.id}','reps',this.value)"></div><div><label>Kg</label><input type="number" inputmode="decimal" value="${e.w}" onchange="upd('${e.id}','w',this.value)"></div><div><label>Riposo s</label><input type="number" inputmode="numeric" value="${e.rest}" onchange="upd('${e.id}','rest',this.value)"></div></div><button onclick="delEx('${e.id}')" style="margin-top:8px">Rimuovi</button></div>`).join('')+
        `</div><div class="win"><h1>Aggiungi esercizio</h1><select id="lib"><option value="-1">Personalizzato…</option>${LIB.map((l,i)=>`<option value="${i}">${l.n} · ${Z[l.z]}</option>`).join('')}</select><input id="cn" placeholder="Nome (se personalizzato)" style="margin-top:8px"><button class="big" onclick="addEx()">Aggiungi</button></div>`}
      else if(tab==='g'){a.innerHTML=head+prog()}
      else if(tab==='c'){a.innerHTML=coach()}
      else if(tab==='s'){const n={str:'Forza',agi:'Agilità',vit:'Vitalità',end:'Resistenza'};
        a.innerHTML=head+`<div class="win" style="text-align:center">${hero(230,'h2')}<h1 style="margin-top:6px">${TT[rk()]} · Rango ${RANK[rk()]}</h1></div>${profile()}<div class="win"><h1>Statistiche</h1><div class="lvl" style="font-size:30px">⚡ ${PWR()}</div><div class="mu" style="margin-bottom:6px">Potenza · ${S.pts?'<b style="color:var(--ok)">'+S.pts+' punti da assegnare</b>':'sale con livello e statistiche'}</div>`+Object.keys(n).map(k=>`<div class="st"><span style="width:90px">${n[k]}</span><div class="bar" style="flex:1;margin:0"><i style="width:${Math.min(100,S.stats[k]*2)}%"></i></div><b>${S.stats[k]}</b>${S.pts?`<button onclick="alloc('${k}')">+</button>`:''}</div>`).join('')+`</div>${custom()}${ach()}`}
      else{let np='non supportate';try{np=Notification.permission}catch(e){}
        a.innerHTML=acct()+`<div class="win"><h1>Notifiche</h1><div class="mu">Stato: ${np}</div><button class="big" onclick="perm()">Attiva notifiche</button><div style="margin-top:12px"><label class="mu">Promemoria giornaliero</label><input type="time" value="${S.rem}" onchange="S.rem=this.value;save()"></div><div class="mu" style="margin-top:10px">Su iPhone funzionano solo se aggiungi la pagina alla Home e la tieni aperta o in background. Suono e vibrazione del riposo funzionano a schermo acceso.</div></div><div class="win"><h1>Storico</h1>`+(S.log.length?S.log.slice(-15).reverse().map(h=>`<div class="st"><span>${h.d}</span><span>${h.xp>0?'+':''}${h.xp} XP · vol ${h.v}</span></div>`).join(''):'<div class="mu">Nessuna missione.</div>')+`</div><button onclick="reset()" style="opacity:.6">Azzera progressi</button>`}}
      function sync(){document.querySelector('nav').style.display=S.aw?'flex':'none';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===tab))}
      document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(!S.setup)return;tab=b.dataset.t;sync();render()});
      for(let i=0;i<16;i++){const p=document.createElement('div');p.className='pt';p.style.cssText=`left:${Math.random()*100}%;--t:${8+Math.random()*10}s;animation-delay:-${Math.random()*14}s`;document.body.appendChild(p)}
      setInterval(()=>{const t=$('tm');if(t)t.textContent=tmTxt();if(S.setup&&S.q.st&&!S.q.done&&!S.q.pen&&Date.now()>S.q.st+allot()){S.q.pen=1;S.xp=Math.max(0,S.xp-25);save();toast('⚠ Tempo scaduto: penalità −25 XP');render()}if(S.setup&&S.q.date!==today()){newDay();render()}
      const hm=new Date().toTimeString().slice(0,5);if(S.setup&&hm===S.rem&&S.lastN!==today()&&!S.q.done&&!S.q.rest){S.lastN=today();save();notify('La missione di oggi ti aspetta! '+motd())}},1000);
      newDay();checkAch();sync();render();cloudInit();boot=0;
      if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
    </script>
  </body>
</html>
